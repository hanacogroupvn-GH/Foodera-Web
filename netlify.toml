[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  DATABASE_MODE = "turso"
  NETLIFY_SECRETS_SCAN_OMIT_PATHS = "public/fonts"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "@libsql/client", "@google/genai", "helmet", "express-rate-limit"]
  included_files = ["server/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
