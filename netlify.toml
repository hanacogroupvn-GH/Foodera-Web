[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  DATABASE_MODE = "turso"
  NETLIFY_SECRETS_SCAN_OMIT_PATHS = "public/fonts"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "@libsql/client", "@google/genai", "helmet", "express-rate-limit"]
  included_files = ["server/**"]

# Serve sitemap.xml with correct XML Content-Type
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=86400"

# Serve robots.txt with correct Content-Type
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Edge Function: inject product SEO meta into HTML for Googlebot / social crawlers
[[edge_functions]]
  function = "seo-inject"
  path = "/product/item/*"

# SPA fallback — static files (sitemap.xml, robots.txt) are served first by Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
