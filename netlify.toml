[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  DATABASE_MODE = "turso"
  NETLIFY_SECRETS_SCAN_OMIT_PATHS = "public/fonts"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "@libsql/client", "@google/genai", "helmet", "express-rate-limit"]
  included_files = ["server/**"]

# Static assets (JS/CSS) — Vite hashed filenames, safe to cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media files — long cache (30 days)
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Fonts — long cache (1 year)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html — always revalidate to pick up new deployments
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Serve sitemap.xml with correct XML Content-Type
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=86400"

# Serve robots.txt with correct Content-Type
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Edge Function: inject product SEO meta into HTML for Googlebot / social crawlers
[[edge_functions]]
  function = "seo-inject"
  path = "/product/item/*"

# Edge Function: inject news/article SEO meta into HTML for Googlebot / social crawlers
[[edge_functions]]
  function = "news-seo-inject"
  path = "/news/*"

# Route dynamic sitemap through serverless function (must be BEFORE SPA fallback)
# force=true ensures this overrides the static public/sitemap.xml file
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap.xml"
  status = 200
  force = true

# SPA fallback — static files (robots.txt, etc.) are served first by Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
