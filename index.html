  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodmax | Global Agri-Export</title>
    
    <!-- Favicon and Branding Icons -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/188/188333.png" sizes="32x32">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/188/188333.png">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/188/188333.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'foodmax-forest': '#006838',
              'foodmax-lime': '#8cc63f',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'float-slow': 'float 3s ease-in-out infinite',
              'float-delayed': 'float 3s ease-in-out 1.5s infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #ffffff;
        color: #111827;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #f3f4f6;
      }
      ::-webkit-scrollbar-thumb {
        background: #006838;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8cc63f;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      .animate-float-delayed {
        animation: float 3s ease-in-out 1.5s infinite;
      }
    </style>
