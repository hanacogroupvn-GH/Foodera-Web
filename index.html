<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodmax | Global Agri-Export</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/188/188333.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/188/188333.png" />
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/188/188333.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script>
      function applyTheme() {
        const stored = localStorage.getItem('theme');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.classList.toggle('dark', stored === 'dark');
          return;
        }

        const hour = new Date().getHours();
        const isDark = hour >= 18 || hour < 6;
        document.documentElement.classList.toggle('dark', isDark);
      }

      applyTheme();
      setInterval(() => {
        const stored = localStorage.getItem('theme');
        if (!stored || stored === 'auto') {
          applyTheme();
        }
      }, 60 * 1000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
