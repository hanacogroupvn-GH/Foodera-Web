<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>FoodEra Official Site</title>
    <meta name="description" content="FoodEra is a leading Vietnamese B2B exporter of premium rice, specialty coffee, and cashew kernels. HACCP & ISO 22000 certified, serving 30+ countries worldwide." />
    <meta name="keywords" content="Vietnam rice export, Vietnamese coffee, cashew kernels, B2B agri-export, Jasmine rice, ST25 rice, Robusta coffee, Arabica coffee, WW320 cashew, agricultural commodities" />
    <meta name="author" content="VIET NAM FOOD ERA COMPANY LIMITED" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foodera.vn/" />
    <meta property="og:title" content="FoodEra Official Site" />
    <meta property="og:description" content="Premium rice, specialty coffee & cashew kernels from Vietnam. HACCP & ISO 22000 certified. Serving importers in 30+ countries." />
    <meta property="og:image" content="https://foodera.vn/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="FoodEra Global Agri-Export" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FoodEra Official Site" />
    <meta name="twitter:description" content="Premium rice, specialty coffee & cashew kernels from Vietnam. HACCP & ISO 22000 certified. Serving importers in 30+ countries." />
    <meta name="twitter:image" content="https://foodera.vn/og-image.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "VIET NAM FOOD ERA COMPANY LIMITED",
      "url": "https://foodera.vn",
      "logo": "https://foodera.vn/logo-era.png",
      "description": "A premier Vietnamese B2B exporter delivering high-grade rice, coffee, and cashew kernels to global markets.",
      "foundingDate": "2010",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "No. 6 Mac Dinh Chi St, Da Kao",
        "addressLocality": "Ho Chi Minh City",
        "addressRegion": "District 1",
        "addressCountry": "VN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+84-964-791-902",
        "contactType": "sales",
        "email": "export@foodera.vn",
        "availableLanguage": ["English", "Chinese", "Vietnamese"]
      }
    }
    </script>

    <!-- Favicons — optimized PNGs (original SVG was 206KB) -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts — Google Fonts CDN (Montserrat + Noto Sans SC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: preload + onload swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" /></noscript>

    <!-- Preconnect to image CDN for faster hero load -->
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Preload LCP hero image -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1769149797509-d005e2d32940?auto=format&fit=crop&q=80&w=1600" />

    <!-- Theme Initialization (Forced Light Theme) -->
    <script>
      (function() {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
