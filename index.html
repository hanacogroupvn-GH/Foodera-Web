
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodmax | Global Agri-Export</title>
    
    <!-- Favicon and Branding Icons -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/188/188333.png" sizes="32x32">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/188/188333.png">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/188/188333.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'foodmax-forest': '#006838',
              'foodmax-lime': '#8cc63f',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'float-slow': 'float 3s ease-in-out infinite',
              'float-delayed': 'float 3s ease-in-out 1.5s infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #ffffff;
        color: #111827;
        -webkit-font-smoothing: antialiased;
      }
      .dark body {
        background-color: #0b1114;
        color: #e5e7eb;
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #f3f4f6;
      }
      ::-webkit-scrollbar-thumb {
        background: #006838;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8cc63f;
      }
      .dark ::-webkit-scrollbar-track {
        background: #111827;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #22c55e;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #a3e635;
      }
      .dark .bg-white {
        background-color: #0f172a;
      }
      .dark .bg-gray-50 {
        background-color: #0b1114;
      }
      .dark .text-gray-900 {
        color: #f1f5f9;
      }
      .dark .text-gray-600,
      .dark .text-gray-500 {
        color: #cbd5f5;
      }
      .dark .border-gray-100 {
        border-color: #1f2937;
      }
      .dark .border-gray-200 {
        border-color: #233043;
      }
      .dark .text-foodmax-forest {
        color: #22c55e;
      }
      .dark .bg-foodmax-forest {
        background-color: #0f3d2a;
      }
      .dark .text-foodmax-lime {
        color: #a3e635;
      }
      .dark .bg-foodmax-lime {
        background-color: #84cc16;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      .animate-float-delayed {
        animation: float 3s ease-in-out 1.5s infinite;
      }
    </style>
    <script>
      function applyTheme() {
        const stored = localStorage.getItem('theme');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.classList.toggle('dark', stored === 'dark');
          return;
        }
        const hour = new Date().getHours();
        const isDark = hour >= 18 || hour < 6;
        document.documentElement.classList.toggle('dark', isDark);
      }
      applyTheme();
      setInterval(() => {
        const stored = localStorage.getItem('theme');
        if (!stored || stored === 'auto') applyTheme();
      }, 60 * 1000);
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
